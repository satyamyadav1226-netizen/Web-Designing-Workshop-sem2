<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive E-commerce Navbar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            padding: 12px 20px;
            color: white;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        /* Navigation Links */
        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: #facc15;
        }

        .cart {
            background-color: #facc15;
            color: black;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Hamburger Menu */
        .menu-toggle {
            display: none;
            font-size: 26px;
            cursor: pointer;
        }

        /* Mobile View */
        @media (max-width: 768px) {

            .menu-toggle {
                display: block;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                background-color: #1e293b;
                position: absolute;
                top: 60px;
                left: 0;
                width: 100%;
                text-align: center;
            }

            .nav-links a {
                padding: 12px 0;
                border-top: 1px solid #334155;
            }

            /* Show menu on hover */
            .navbar:hover .nav-links {
                display: flex;
            }
        }
    </style>
</head>

<body>

<div class="navbar">
    <div class="logo">ShopCart</div>

    <div class="menu-toggle">☰</div>

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Offers</a>
        <a href="#">Login</a>
        <a href="#" class="cart">Cart</a>
    </div>
</div>

</body>
</html>
